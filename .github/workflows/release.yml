name: Release

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Validate project
        run: npm run ci

      - name: Verify release versions
        run: node scripts/release.js

      - name: Build plugin JSON
        run: TIDDLYWIKI_PLUGIN_PATH=./plugins npx tiddlywiki ./test/wiki --output ./dist --rendertiddler "$:/plugins/theophile.dev/inplace-upgrade" "inplace-upgrade.json" "text/plain" "$:/core/templates/tiddler.json"

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          files: dist/library.html
