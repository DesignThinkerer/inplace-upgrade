name: Release

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Cache Playwright binaries
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright browser
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium

      - name: Install Playwright system dependencies
        run: npx playwright install-deps chromium

      - name: Validate project
        run: npm run ci

      - name: Verify release versions
        run: node scripts/release.js
        
      - name: Build plugin JSON
        run: TIDDLYWIKI_PLUGIN_PATH=./plugins npx tiddlywiki ./test/wiki --output ./dist --rendertiddler "$:/plugins/theophile.dev/inplace-upgrade" "inplace-upgrade.json" "text/plain" "$:/core/templates/json-tiddler"


      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          files: dist/inplace-upgrade.json
          generate_release_notes: true
