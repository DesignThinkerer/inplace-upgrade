name: Release

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Get installed Playwright version
        id: playwright-version
        run: echo "version=$(npm ls @playwright/test | grep @playwright | sed 's/.*@//')" >> $GITHUB_OUTPUT

      - name: Cache Playwright binaries
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright-version.outputs.version }}

      - name: Install Playwright browser
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium

      - name: Install Playwright system dependencies
        run: npx playwright install-deps chromium

      - name: Validate project
        run: npm run ci

      - name: Verify release versions
        run: node scripts/release.js

      - name: Build plugin JSON
        run: TIDDLYWIKI_PLUGIN_PATH=./plugins npx tiddlywiki ./test/wiki --output ./dist --rendertiddler "$:/plugins/theophile.dev/inplace-upgrade" "inplace-upgrade.json" "text/plain" "$:/core/templates/tiddler.json"

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          files: dist/inplace-upgrade.json
